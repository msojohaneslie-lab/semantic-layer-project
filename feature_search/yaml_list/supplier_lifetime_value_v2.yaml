source_type: ODPS
name: supplier_lifetime_value
description: Feature view capturing the comprehensive behavioral profile and lifetime performance value metrics for suppliers.
entity: supplier
ttl: 5500d # ~15 yr
feature_fields:
  - name: supplier_id
    type: STRING
    description: Unique tracking identification string for the supplier entity.
    business_logic: NULLIF(TRIM(id_supplier),'')
  - name: beforeexpired_days_max
    type: INTEGER
    description: Absolute maximum recorded timeline cushion between contract binding and registration validity endings.
    business_logic: MAX(day_before_expire)
  - name: beforeexpired_days_mean
    type: DOUBLE
    description: Average residual lifetime validity span margin calculation across business portfolios.
    business_logic: AVG(day_before_expire) by excluding the negative number.
  - name: beforeexpired_days_median
    type: INTEGER
    description: Middle-ground timeline longevity cushion values tracking operational validation safe horizons.
    business_logic: MEDIAN(day_before_expire)
  - name: beforeexpired_days_min
    type: INTEGER
    description: Lower bounds metrics representing safety margins between deal settlement actions and formal profile registration expiries.
    business_logic: MIN(day_before_expire)
  - name: business_npwp_most
    type: STRING
    description: Primary statistical mode matching the corporate tax registration footprint most frequently processed across transactional interactions.
    business_logic: ROW_NUMBER() OVER (PARTITION BY supplier_id ORDER BY COUNT(*) DESC)
  - name: business_ownership_most
    type: STRING
    description: Predominant property facility legal tenure category tracked by baseline volume distribution profiles.
    business_logic: ROW_NUMBER() OVER (PARTITION BY supplier_id ORDER BY COUNT(*) DESC)
  - name: contract_npl_count
    type: INTEGER
    description: Cumulative count of non-performing loan historical occurrences.
    business_logic: SUM(contract_npl_exist) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: contract_release_count
    type: INTEGER
    description: Cumulative count of contract release historical occurrences.
    business_logic: SUM(contract_release_exist) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: contract_wo_count
    type: INTEGER
    description: Cumulative count of write-off contract operational profiles.
    business_logic: SUM(contract_wo_exist) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: creditreview_waiting_time_max
    type: INTEGER
    description: Maximum timeline turnaround for credit review processing stages.
    business_logic: MAX(creditreview_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: creditreview_waiting_time_mean
    type: DOUBLE
    description: Average timeline turnaround for credit review processing stages.
    business_logic: AVG(creditreview_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: creditreview_waiting_time_min
    type: INTEGER
    description: Minimum timeline turnaround for credit review processing stages.
    business_logic: MIN(creditreview_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: creditreview_waiting_time_std
    type: DOUBLE
    description: Standard deviation of credit review waiting time metrics.
    business_logic: STDDEV(creditreview_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: creditscoring_waiting_time_max
    type: INTEGER
    description: Maximum observed delay tracking credit scoring processing milestones.
    business_logic: MAX(creditscoring_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: creditscoring_waiting_time_mean
    type: DOUBLE
    description: Average observed delay tracking credit scoring processing milestones.
    business_logic: AVG(creditscoring_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: creditscoring_waiting_time_min
    type: INTEGER
    description: Minimum observed delay tracking credit scoring processing milestones.
    business_logic: MIN(creditscoring_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: creditscoring_waiting_time_std
    type: DOUBLE
    description: Standard deviation of credit scoring waiting metrics.
    business_logic: STDDEV(creditscoring_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: delivery_to_purchase_max
    type: INTEGER
    description: Maximum delivery order to purchase order days interval duration.
    business_logic: MAX(delivery_to_purchase) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: delivery_to_purchase_mean
    type: DOUBLE
    description: Average delivery order to purchase order days interval duration.
    business_logic: AVG(delivery_to_purchase) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: delivery_to_purchase_min
    type: INTEGER
    description: Minimum delivery order to purchase order days interval duration.
    business_logic: MIN(delivery_to_purchase) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: delivery_to_purchase_std
