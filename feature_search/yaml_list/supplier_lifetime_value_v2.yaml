    type: DOUBLE
    description: Variance metric tracking lifecycle installation computation records.
    business_logic: STDDEV(time_to_lcinstallmentcalc) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: time_mature_max
    type: INTEGER
    description: Absolute upper timeline limits observing active loan portfolio maturation fields.
    business_logic: MAX(time_to_mature) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: time_mature_mean
    type: DOUBLE
    description: Global profile mean checking ongoing maturity timelines.
    business_logic: AVG(time_to_mature) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: time_mature_min
    type: INTEGER
    description: Bottom ceiling layout marking minimal portfolio processing maturity records.
    business_logic: MIN(time_to_mature) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: time_mature_std
    type: DOUBLE
    description: Structural footprint deviation tracking baseline maturity velocity spans.
    business_logic: STDDEV(time_to_mature) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: total_sales_anomaly
    type: BOOLEAN
    description: Tracks anomalies where volume metrics values dropped backwards on sequential contracts.
    business_logic: CASE WHEN SUM(total_sales_anomaly) > 0 THEN TRUE ELSE FALSE END
  - name: total_sales_first
    type: DOUBLE
    description: Exponential base value scaling of minimum historical tier calculation metrics for initial transactions.
    business_logic: POW(5,MIN(total_sales))
  - name: total_sales_last
    type: DOUBLE
    description: Exponential base value scaling of maximum tier metrics for trailing transactional contracts.
    business_logic: POW(5,MAX(total_sales))
  - name: total_sales_median
    type: DOUBLE
    description: Median value of computed exponential ranking tiers evaluating raw overall sales velocity.
    business_logic: POW(5,MEDIAN(total_sales))  
  - name: event_timestamp
    type: TIMESTAMP
    description: Primary historical reference timestamp tracking the latest date context between core data profile generation or signed contract records.
    business_logic: MAX(GREATEST(created_timestamp, contract_timestamp))  
join_keys:
  - supplier_id
tags:
  domain: supplier
  confidentiality: public
sql: |-
  WITH filtered_dim_supplier AS 
  (
      SELECT  DISTINCT NULLIF(TRIM(id_supplier),'') AS supplier_id
              ,TOUPPER(TRIM(supplier)) AS supplier_name
              ,CAST(effective_date AS TIMESTAMP) AS created_timestamp
              ,sk_supplier
              ,sk_region
              ,sk_supplier_category
              ,NULLIF(TOUPPER(TRIM(supplier_kelurahan)),'') AS supplier_kelurahan
              ,NULLIF(TOUPPER(TRIM(supplier_kecamatan)),'') AS supplier_kecamatan
              ,NULLIF(TOUPPER(TRIM(supplier_kota)),'') AS supplier_kota
              ,expiration_date
              ,CASE   WHEN npwptype IN ('C','P') THEN npwptype
                      ELSE '-'
              END AS supplier_npwp
              ,CASE   WHEN supplier_group LIKE 'BRONZE%' THEN 'BRONZE'
                      WHEN supplier_group LIKE 'SILVER%' THEN 'SILVER'
                      WHEN supplier_group LIKE 'GOLD%' THEN 'GOLD'
                      WHEN supplier_group LIKE 'PLATINUM%' THEN 'PLATINUM'
              END AS supplier_group
              ,CASE   WHEN TOLOWER(TRIM(supplier_size)) LIKE '%menengah' THEN 'medium'
                      WHEN TOLOWER(TRIM(supplier_size)) LIKE '%kecil' THEN 'small'
                      WHEN TOLOWER(TRIM(supplier_size)) LIKE '%besar' THEN 'big'
              END AS supplier_size
              ,isautomotive
              ,CASE   WHEN TRIM(lokasishowroomdescription) IN ('Bursa mobil','Pinggir jalan utama','Perumahan','Perkampungan') THEN TRIM(lokasishowroomdescription)
              END AS lokasishowroomdescription
              ,CASE   WHEN TOLOWER(TRIM(kepemilikantempatusaha)) IN ('sewa','miliksendiri') THEN TRIM(kepemilikantempatusaha)
              END AS kepemilikantempatusaha
              ,CASE   WHEN CAST(pengalamansejaktahun AS INT) < 2000 THEN 2000
                      -- WHEN CAST(pengalamansejaktahun AS INT) > EXTRACT (YEAR FROM TO_DATE('20260623','yyyymmdd')) THEN EXTRACT (YEAR FROM TO_DATE('20260623','yyyymmdd')) 
                      WHEN CAST(pengalamansejaktahun AS INT) > EXTRACT(YEAR FROM TO_DATE('{bizdate}', 'yyyymmdd')) THEN EXTRACT(YEAR FROM TO_DATE('{bizdate}', 'yyyymmdd'))
              END AS pengalamansejaktahun
              ,CASE   WHEN CAST(pkddenganbfitahun AS INT) < 2000 THEN 2000
                      -- WHEN CAST(pkddenganbfitahun AS INT) > EXTRACT (YEAR FROM TO_DATE('20260623','yyyymmdd')) THEN EXTRACT (YEAR FROM TO_DATE('20260623','yyyymmdd')) 
                      WHEN CAST(pkddenganbfitahun AS INT) > EXTRACT(YEAR FROM TO_DATE('{bizdate}', 'yyyymmdd')) THEN EXTRACT(YEAR FROM TO_DATE('{bizdate}', 'yyyymmdd'))
              END AS pkddenganbfitahun
              ,CAST(birthdatepemilik AS DATETIME) AS dob_showroom_owner
              ,CASE   WHEN TRIM(jumlahpenjualan_sales) = '6-15 unit' THEN 2
                      WHEN TRIM(jumlahpenjualan_sales) = '1-5 unit' THEN 1
                      WHEN TRIM(jumlahpenjualan_sales) = '> 15 unit' THEN 3
                      ELSE 0
              END AS total_sales
      FROM    wsBFI_2.dwh_dim_supplier_odps
      WHERE   row_is_current_ind = TRUE -- expiration_date NOT YET FILLED 
      OR expiration_date >= DATEADD(TO_DATE('{bizdate}', 'yyyymmdd'), -15, 'yyyy') 
      -- expired not more than 15 years -- row_is_current_ind = FALSE
  )
  ,filtered_fact_contract AS 
  (
      -- by sk_supplier
      SELECT  t2.sk_supplier
              ,NULLIF(TRIM(id_application),'') AS application_id
              ,NULLIF(TRIM(agreementno),'') AS agreement_number
              ,TO_DATE(
                      CAST(GREATEST(sk_approval_date,sk_agreementdate,sk_application_date,sk_golive_date) AS STRING)
              ,'yyyymmdd') AS event_ts
              ,CAST(supplier_rate AS FLOAT) AS supplier_rate
              ,sk_supplier_level
              ,sk_supplier_asset_status
              ,sk_supplier_industry
              ,sk_supplier_potency
              ,sk_supplier_status
              ,percentagesupplier
              ,percentagerewardsupplier
              ,sk_product
      FROM    wsBFI_2.dwh_fact_contract_odps t1
      INNER JOIN  (
                      SELECT  sk_supplier
                      FROM    filtered_dim_supplier
                  ) t2
      ON      t1.sk_supplier = t2.sk_supplier
  )
  ,filtered_agreement_prep0 AS 
  (
      -- by supplier_id
      SELECT  t1.supplier_id
              ,NULLIF(TRIM(t2.applicationid),'') AS application_id
              ,NULLIF(TRIM(t2.agreementno),'') AS agreement_number
              ,t2.supplierrate AS supplier_rate
              ,GREATEST(newapplicationdate,approvaldate,agreementdate,effectivedate,golivedate) AS event_ts 
              -- scoringqcadate,surveydateqca,validationsurveyresultcadate,rejectiondate,cancellationdate,lastlcadminfeecalcdate,closingmemodate,fundingbatchdate,fundingdate,dateentrylifeinsurancedata all null
              -- requestsurveydate,lastlcinsurancecalcdate,floatingnextreviewdate nearly empty
              -- nextinstallmentduedate,nextinstallmentdate may contains distantly related data after event_timestamp
              
              ,supplierinvoicedate -- for datediff with event_timestamp later on
              ,maturitydate -- for datediff with event_timestamp later on
              ,lastlcinstallmentcalcdate -- for datediff with event_timestamp later on
              ,returndate -- for datediff with event_timestamp later on

              ,DATEDIFF(surveydate, newapplicationdate, 'dd') survey_waiting_time
              ,DATEDIFF(creditscoringdate, newapplicationdate, 'dd') creditscoring_waiting_time
              ,DATEDIFF(creditreviewdate, newapplicationdate, 'dd') creditreview_waiting_time
              ,GREATEST(-1, DATEDIFF(rcadate, newapplicationdate, 'dd')) rca_waiting_time
              ,DATEDIFF(deliveryorderdate, purchaseorderdate, 'dd') delivery_to_purchase

              ,CASE WHEN rrddate IS NOT NULL THEN 1 END AS contract_release_exist
              ,CASE WHEN nadate IS NOT NULL THEN 1 END AS contract_npl_exist
              ,CASE WHEN wodate IS NOT NULL THEN 1 END AS contract_wo_exist
              ,CASE WHEN dateentrylifeinsurance IS NOT NULL THEN 1 END AS entry_lifeinsurance_exist
              ,CASE WHEN pdcpromiseddate IS NOT NULL THEN 1 END AS pdc_promised_exist

              ,LEAST(dateentryapplicationdata,dateentryassetdata,dateentryinsurancedata,dateentryfinancialdata,dateentryotherdata,dateentrycommisiondata) entrydata_start_time
              ,GREATEST(dateentryapplicationdata,dateentryassetdata,dateentryinsurancedata,dateentryfinancialdata,dateentryotherdata,dateentrycommisiondata) entrydata_finish_time

              ,t2.supplierflatrate
              ,NULLIF(TOUPPER(TRIM(mailingkelurahan)),'') mailing_kelurahan
              ,NULLIF(TOUPPER(TRIM(mailingkecamatan)),'') mailing_kecamatan
              ,NULLIF(TOUPPER(TRIM(mailingcity)),'') mailing_kota
              ,productid
      FROM    (
                  SELECT  supplier_id
                  FROM    filtered_dim_supplier
              ) t1
      INNER JOIN wsbfi_2.confins_stg_agreement_odps t2
      -- INNER JOIN wsBFI_2.agreement_odps t2 -- tabel tidak termaintain dengan baik
      ON      t1.supplier_id = NULLIF(TRIM(t2.supplierid), "")
      -- WHERE   t2.pt = CASE   WHEN '{bizdate}' < '20100101' THEN '20100101'
      --       ELSE '{bizdate}'
      -- END  
  )
  ,filtered_agreement_odps AS (
      SELECT *, ROW_NUMBER() OVER(PARTITION BY COALESCE(application_id, agreement_number), supplier_id ORDER BY event_ts) AS rn 
      FROM filtered_agreement_prep0
  )
  ,supplier_join_contract AS 
  (
      SELECT  t1.*
              ,t5.* EXCEPT (supplier_id,sk_supplier,rn)
              ,DATEDIFF(contract_timestamp,supplierinvoicedate,'dd') supplierinvoice_days_ago
              ,DATEDIFF(maturitydate,contract_timestamp,'dd') time_to_mature
              ,DATEDIFF(lastlcinstallmentcalcdate,contract_timestamp,'dd') time_to_lcinstallmentcalc
              ,DATEDIFF(contract_timestamp,returndate,'dd') return_days_ago
              ,ROUND(DATEDIFF(entrydata_finish_time,entrydata_start_time,'hh') / 24.0,2) entrydata_process_time
              ,COALESCE(vdp1.product, vdp2.product) AS product -- t4.product
              -- let's separate timestamp between dim_supplier and contract_odps
              -- ,GREATEST(t1.created_timestamp,t5.contract_timestamp) AS event_timestamp
      FROM    filtered_dim_supplier t1
      LEFT JOIN   (
                      SELECT  -- 1. Explicitly pull out agreement_number with COALESCE
                              COALESCE(t2.agreement_number, t3.agreement_number) AS agreement_number
                              ,COALESCE(t2.application_id, t3.application_id) AS application_id
                              ,t2.* EXCEPT(agreement_number,application_id,event_ts,supplier_rate)
                              ,t3.* EXCEPT(agreement_number,application_id,event_ts,supplier_rate)
                              ,COALESCE(t2.supplier_rate,t3.supplier_rate) AS supplier_rate
                              ,GREATEST(t2.event_ts,t3.event_ts) AS contract_timestamp
                              ,ROW_NUMBER() OVER(
                                  PARTITION BY supplier_id, sk_supplier, 
                                      COALESCE(t2.agreement_number, t3.agreement_number), -- 3. Fixed partition key
                                      COALESCE(t2.application_id, t3.application_id), 
                                      COALESCE(t2.productid, t3.sk_product), 
                                      UNIX_TIMESTAMP(GREATEST(t2.event_ts,t3.event_ts)) 
                                  ORDER BY t2.event_ts DESC, t3.event_ts DESC
                              ) rn -- to remove duplicate rows after performing full join
                      FROM    (SELECT * EXCEPT(rn) FROM filtered_agreement_odps where rn = 1) t2
                      FULL JOIN filtered_fact_contract t3
                      ON      t2.agreement_number = t3.agreement_number
                  ) t5
      ON      t1.supplier_id = t5.supplier_id
      AND     t1.sk_supplier = t5.sk_supplier 
      -- LEFT JOIN (SELECT * FROM wsBFI_2.dwh_dim_product_odps WHERE row_is_current_ind = TRUE) t4
      -- ON      CAST(TRIM(t2.productid) AS INT) = t4.id_product
      -- ON     t3.sk_product = t4.sk_product
      LEFT JOIN wsbfi_2.dwh_vw_dim_product_odps vdp1-- by id_product
      ON      CAST(TRIM(t5.productid) AS INT) = vdp1.id_product
      AND     CAST(t5.contract_timestamp AS DATETIME) BETWEEN vdp1.effective_date AND COALESCE(vdp1.expiration_date,TO_DATE('{bizdate}','yyyymmdd'))
      LEFT JOIN wsbfi_2.dwh_vw_dim_product_odps vdp2-- by sk_product
      ON      CAST(TRIM(t5.sk_product) AS INT) = vdp2.sk_product
      AND     CAST(t5.contract_timestamp AS DATETIME) BETWEEN vdp2.effective_date AND COALESCE(vdp2.expiration_date,TO_DATE('{bizdate}','yyyymmdd'))
      -- LEFT JOIN wsdatainnovation.cdp_loan t4
      -- ON      t4.dt = t5.pt
      -- AND     t4.agreement_number = t5.agreement_number
      -- WHERE   COALESCE(rn, 1) = 1
      WHERE   t5.rn = 1
  )
  ,joined_prep0 AS (
      SELECT  supplier_id
              ,supplier_name
              ,sk_supplier
              ,sk_region

              ,sk_supplier_category
              ,sk_supplier_level	
              ,sk_supplier_asset_status	
              ,sk_supplier_industry	
              ,sk_supplier_potency	
              ,sk_supplier_status
              ,NULLIF(TRIM(supplier_kelurahan),'-') supplier_kelurahan
              ,NULLIF(TRIM(supplier_kecamatan),'-') supplier_kecamatan	
              ,NULLIF(TRIM(supplier_kota),'-') supplier_kota
              ,expiration_date
              ,supplier_npwp
              ,supplier_group
              ,supplier_size	
              ,isautomotive	
              ,lokasishowroomdescription
              ,kepemilikantempatusaha	
              ,pengalamansejaktahun	
              ,pkddenganbfitahun
              ,dob_showroom_owner
              ,total_sales
              ,percentagesupplier	
              ,percentagerewardsupplier

              ,TO_CHAR(created_timestamp, 'yyyymmdd') ts_id
              ,created_timestamp
              ,ROW_NUMBER() OVER(PARTITION BY supplier_id,supplier_name,sk_supplier,sk_region,UNIX_TIMESTAMP(created_timestamp) ORDER BY created_timestamp DESC) rn
          FROM    supplier_join_contract
          WHERE   created_timestamp IS NOT NULL
  )
  ,joined_table_prep1 AS (
      SELECT  COALESCE(t1.supplier_id, t2.supplier_id) AS supplier_id
              ,COALESCE(t1.supplier_name, t2.supplier_name) AS supplier_name
              ,COALESCE(t1.sk_supplier, t2.sk_supplier) AS sk_supplier
              ,COALESCE(t1.sk_region, t2.sk_region) AS sk_region
              ,COALESCE(t1.ts_id, t2.ts_id) AS ts_id
              ,t1.* EXCEPT(supplier_id, supplier_name, sk_supplier, sk_region, ts_id, rn)
              ,t2.* EXCEPT(supplier_id, supplier_name, sk_supplier, sk_region, ts_id, rn)
      FROM ( SELECT * FROM joined_prep0 WHERE rn = 1 ) t1
      FULL JOIN (
          SELECT  supplier_id
                  ,supplier_name
                  ,sk_supplier
                  ,sk_region

                  ,application_id
                  ,agreement_number
                  ,survey_waiting_time
                  ,creditscoring_waiting_time	
                  ,creditreview_waiting_time	
                  ,rca_waiting_time	
                  ,delivery_to_purchase	
                  ,contract_release_exist
                  ,contract_npl_exist	
                  ,contract_wo_exist	
                  ,entry_lifeinsurance_exist	
                  ,pdc_promised_exist	
                  ,supplierflatrate	
                  ,mailing_kelurahan	
                  ,mailing_kecamatan	
                  ,mailing_kota
                  ,supplier_rate
                  ,supplierinvoice_days_ago	
                  ,time_to_mature	
                  ,time_to_lcinstallmentcalc
                  ,return_days_ago	
                  ,entrydata_process_time	
                  ,product

                  ,TO_CHAR(contract_timestamp, 'yyyymmdd') ts_id
                  ,contract_timestamp
                  ,CAST(1 AS INT) rn
          FROM    supplier_join_contract
          WHERE   contract_timestamp IS NOT NULL
      ) t2
      ON      t1.supplier_id = t2.supplier_id
      AND     t1.supplier_name = t2.supplier_name
      AND     t1.sk_supplier = t2.sk_supplier
      AND     t1.sk_region = t2.sk_region
      AND     t1.ts_id = t2.ts_id
  )
  ,joined_table_prep2 AS (
      SELECT * EXCEPT(expiration_date, pengalamansejaktahun, pkddenganbfitahun, dob_showroom_owner, created_timestamp)
            ,LAST_VALUE(pengalamansejaktahun, true) OVER(PARTITION BY supplier_id ORDER BY ts_id ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) pengalamansejaktahun
            -- backfill
            ,FIRST_VALUE(expiration_date, true) OVER(PARTITION BY supplier_id ORDER BY ts_id ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING) expiration_date
            ,LAST_VALUE(pkddenganbfitahun, true) OVER(PARTITION BY supplier_id ORDER BY ts_id ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) pkddenganbfitahun
            ,FIRST_VALUE(dob_showroom_owner, true) OVER(PARTITION BY supplier_id ORDER BY ts_id ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING) dob_showroom_owner
            ,LAST_VALUE(created_timestamp, true) OVER(PARTITION BY supplier_id ORDER BY ts_id ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) created_timestamp
      FROM joined_table_prep1
  )
  ,joined_feature_table2 AS 
  (
      SELECT  *
              ,ROUND(DATEDIFF(CAST(contract_timestamp AS DATETIME),dob_showroom_owner,'dd') / 365.24,1) AS showroom_ownerage
              ,DATEPART(contract_timestamp,'yyyy') - CAST(pengalamansejaktahun AS INT) AS length_experience
              ,YEAR(contract_timestamp) - CAST(pkddenganbfitahun AS INT) AS length_partnership
              ,(CASE   WHEN supplier_kecamatan <> mailing_kecamatan THEN 1
                      ELSE 0
              END) AS kecamatan_match
              ,(CASE   WHEN supplier_kelurahan <> mailing_kelurahan THEN 1
                      ELSE 0
              END) AS kelurahan_match
              ,(CASE   WHEN supplier_kota <> mailing_kota THEN 1
                      ELSE 0
              END) AS kota_match
      FROM    joined_table_prep2
  )
  ,supplier_contract_prep3 AS (
      SELECT  *
              -- LEAD utilization potentially causing data leak
              -- ,LEAD(length_experience,1) OVER (PARTITION BY supplier_id ORDER BY contract_timestamp ) AS next_experience
              -- ,LEAD(length_partnership,1) OVER (PARTITION BY supplier_id ORDER BY contract_timestamp ) AS next_partnership
              -- ,LEAD(showroom_owner_age,1) OVER (PARTITION BY supplier_id ORDER BY contract_timestamp ) AS next_owner_age
              -- ,LEAD(total_sales,1) OVER (PARTITION BY supplier_id ORDER BY contract_timestamp ) AS next_achievement
              ,LAG(length_experience, 1) OVER(PARTITION BY supplier_id ORDER BY contract_timestamp) AS prev_experience
              ,LAG(length_partnership,1) OVER(PARTITION BY supplier_id ORDER BY contract_timestamp ) AS prev_partnership
              ,LAG(showroom_ownerage,1) OVER(PARTITION BY supplier_id ORDER BY contract_timestamp ) AS prev_ownerage
              ,LAG(total_sales,1) OVER(PARTITION BY supplier_id ORDER BY contract_timestamp ) AS prev_achievement
              -- with assumption contract_timestamp should be higher than created_timestamp
              ,DATEDIFF(contract_timestamp,CAST(created_timestamp AS DATETIME),'dd') harvest_day
              -- with assumption expiration_date should be higher than contract_date
              ,DATEDIFF(expiration_date,CAST(contract_timestamp AS DATETIME),'dd') day_before_expire
      FROM    joined_feature_table2
  )
  ,supplier_contract_prep4 AS 
  (
      SELECT  * -- current record must be larger or equals to previous record
              ,CASE   WHEN (length_experience - prev_experience) < 0 THEN 1
                      ELSE 0
              END AS length_experience_anomaly
              ,CASE   WHEN (length_partnership - prev_partnership) < 0 THEN 1
                      ELSE 0
              END AS length_partnership_anomaly
              ,CASE   WHEN (showroom_ownerage - prev_ownerage) < 0 THEN 1
                      ELSE 0
              END AS showroom_ownerage_anomaly
              ,CASE   WHEN (total_sales - prev_achievement) < 0 THEN 1
                      ELSE 0
              END AS total_sales_anomaly

              ,TO_CHAR(CAST(created_timestamp AS DATETIME),'yyyymmdd') AS tmp_id1
              ,TO_CHAR(CAST(contract_timestamp AS DATETIME),'yyyymmdd') AS tmp_id2
      FROM supplier_contract_prep3
  )
  ,final_preparation AS (
      SELECT  *
              -- in order to remove duplicate info on supplier entity (due to merging with contract)
              ,ROW_NUMBER() OVER (PARTITION BY supplier_id,sk_supplier,sk_region,tmp_id1 ORDER BY created_timestamp DESC,expiration_date DESC) AS rn_s2

              -- combination between supplier and contract
              ,ROW_NUMBER() OVER (PARTITION BY supplier_id,agreement_number,tmp_id2 ORDER BY contract_timestamp DESC ) AS rn_c2
              ,CAST(contract_timestamp AS TIMESTAMP) AS event_timestamp -- copy here to separate it from created_timestamp of dim_supplier
      FROM    supplier_contract_prep4
  )
  ,aggregate_supplier_prep1 AS 
  (
      SELECT  supplier_id
              ,tmp_id1 AS ts_id              
              
              ,FIRST_VALUE(created_timestamp) OVER(PARTITION BY supplier_id ORDER BY created_timestamp 
                  ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
              ) AS earliest_checkin_time
              -- ,LAST_VALUE(sk_region) OVER(PARTITION BY supplier_id ORDER BY created_timestamp 
              --     ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
              -- ) AS sk_region
              ,sk_region
              ,sk_supplier
              ,sk_supplier_category
              ,supplier_name
              ,LAST_VALUE(supplier_kelurahan) OVER(PARTITION BY supplier_id ORDER BY created_timestamp 
                  ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
              ) AS supplier_kelurahan
              ,LAST_VALUE(supplier_kecamatan) OVER(PARTITION BY supplier_id ORDER BY created_timestamp 
                  ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
              ) AS supplier_kecamatan
              ,LAST_VALUE(supplier_kota) OVER(PARTITION BY supplier_id ORDER BY created_timestamp 
                  ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
              ) AS supplier_kota
              ,COUNT(DISTINCT sk_supplier) OVER(PARTITION BY supplier_id ORDER BY created_timestamp 
                  ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
              ) AS number_of_updates
              -- ,MAX(expiration_date) OVER(PARTITION BY supplier_id ORDER BY created_timestamp 
              --     ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
              -- ) AS latest_expired_date
              ,LAST_VALUE(supplier_npwp) OVER(PARTITION BY supplier_id ORDER BY created_timestamp 
                  ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
              ) AS supplier_npwp
              ,COUNT(DISTINCT supplier_npwp) OVER(PARTITION BY supplier_id ORDER BY created_timestamp 
                  ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
              ) AS supplier_npwp_nunique
              ,LAST_VALUE(supplier_group) OVER(PARTITION BY supplier_id ORDER BY created_timestamp 
                  ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
              ) AS supplier_group
              ,COUNT(DISTINCT sk_supplier_level) OVER(PARTITION BY supplier_id ORDER BY created_timestamp 
                  ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
              ) AS supplier_level_nunique
              ,MIN(sk_supplier_level) OVER(PARTITION BY supplier_id ORDER BY created_timestamp 
                  ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
              ) AS supplier_level_min
              ,MAX(sk_supplier_level) OVER(PARTITION BY supplier_id ORDER BY created_timestamp 
                  ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
              ) AS supplier_level_max
              ,COUNT(DISTINCT sk_supplier_asset_status) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS supplier_assetstatus_nunique
              ,MIN(sk_supplier_asset_status) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS supplier_assetstatus_min
              ,MAX(sk_supplier_asset_status) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS supplier_assetstatus_max
              ,COUNT(DISTINCT sk_supplier_industry) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS supplier_industry_nunique
              ,MIN(sk_supplier_industry) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS supplier_industry_min
              ,MAX(sk_supplier_industry) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS supplier_industry_max
              ,COUNT(DISTINCT sk_supplier_potency) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS supplier_potency_nunique
              ,MIN(sk_supplier_potency) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS supplier_potency_min
              ,MAX(sk_supplier_potency) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS supplier_potency_max
              ,COUNT(DISTINCT sk_supplier_status) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS supplier_status_nunique
              ,MIN(sk_supplier_status) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS supplier_status_min
              ,MAX(sk_supplier_status) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS supplier_status_max
              
              ,FIRST_VALUE(supplier_size) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS supplier_size_first -- 27
              ,LAST_VALUE(supplier_size) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS supplier_size_last -- 28
              ,FIRST_VALUE(isautomotive) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS isautomotive_first -- 24
              ,LAST_VALUE(isautomotive) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS isautomotive_last -- 25
              ,FIRST_VALUE(lokasishowroomdescription) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS showroom_location_first -- 21
              ,LAST_VALUE(lokasishowroomdescription) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS showroom_location_last -- 22
              ,FIRST_VALUE(kepemilikantempatusaha) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS showroom_ownership_first -- 18
              ,LAST_VALUE(kepemilikantempatusaha) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS showroom_ownership_last -- 19
              -- just to make gap between categories (1..3)
              ,POW(5,
                  MIN(total_sales) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ) AS total_sales_first -- 14
              ,POW(5,
                  MAX(total_sales) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ) AS total_sales_last -- 15
              ,POW(5,
                  MEDIAN(total_sales) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ) AS total_sales_median -- 16
              ,CASE   WHEN COUNT(DISTINCT supplier_size) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) > 1 THEN TRUE
                      ELSE FALSE
              END AS supplier_size_modified
              ,CASE   WHEN COUNT(DISTINCT isautomotive) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) > 1 THEN TRUE
                      ELSE FALSE
              END AS isautomotive_modified
              ,CASE   WHEN COUNT(DISTINCT lokasishowroomdescription) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) > 1 THEN TRUE
                      ELSE FALSE
              END AS showroom_location_modified -- 23
              ,CASE   WHEN COUNT(DISTINCT kepemilikantempatusaha) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) > 1 THEN TRUE
                      ELSE FALSE
              END AS showroom_ownership_modified -- 20
              ,CASE   WHEN SUM(total_sales_anomaly) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) > 0 THEN 1
                      ELSE 0
              END AS total_sales_anomaly -- 17
              ,MIN(percentagesupplier) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS percentage_supplier_min
              ,MAX(percentagesupplier) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS percentage_supplier_max
              ,MIN(percentagerewardsupplier) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS percentage_reward_min
              ,MAX(percentagerewardsupplier) OVER(PARTITION BY supplier_id ORDER BY created_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS percentage_reward_max

              ,ROW_NUMBER() OVER(PARTITION BY supplier_id, tmp_id1 ORDER BY created_timestamp DESC) rn
              -- latest timestamp for each entity snapshot (daily)
              ,MAX(created_timestamp) OVER(PARTITION BY supplier_id, tmp_id1) AS event_timestamp 
      FROM    final_preparation
      WHERE rn_s2 = 1 -- only 1 copy of supplier each day
      -- GROUP BY supplier_id
  )
  ,aggregate_view_s AS (
      SELECT * EXCEPT(rn)
      FROM aggregate_supplier_prep1
      WHERE rn = 1
  )
  ,aggregate_contract_prep1 AS 
  (
      -- supplier & contract level
      SELECT  supplier_id
              ,tmp_id2 AS ts_id 
              -- event_timestamp already covered contract_timestamp
              ,MIN(length_experience) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS length_experience_min -- 2
              ,MAX(length_experience) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS length_experience_max -- 3
              ,ROUND(
                    AVG(length_experience) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,1) AS length_experience_mean -- 4
              ,MIN(length_partnership) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS length_partnership_min -- 6
              ,MAX(length_partnership) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS length_partnership_max -- 7
              ,ROUND(
                    AVG(length_partnership) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,1) AS length_partnership_mean -- 8
              ,MIN(showroom_ownerage) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS showroom_ownerage_min -- 10
              ,MAX(showroom_ownerage) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS showroom_ownerage_max -- 11
              ,ROUND(
                    AVG(showroom_ownerage) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,1) AS showroom_ownerage_mean -- 12

              ,MIN(supplierflatrate) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS flat_rate_min
              ,MAX(supplierflatrate) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS flat_rate_max
              ,ROUND(
                    AVG(supplierflatrate) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) AS flat_rate_mean
              
              ,MIN(supplier_rate) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS supplier_rate_min -- 37
              ,MAX(supplier_rate) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS supplier_rate_max -- 38
              ,ROUND(
                    AVG(supplier_rate) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) AS supplier_rate_mean -- 39
              ,SUM(kecamatan_match) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS kecamatan_match_count
              ,SUM(kelurahan_match) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS kelurahan_match_count
              ,SUM(kota_match) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS kota_match_count
              ,MIN(harvest_day) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS harvest_day_min -- 29
              ,MAX(harvest_day) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS harvest_day_max -- 30
              ,ROUND(
                    AVG(CASE    WHEN harvest_day >= 0 THEN harvest_day END) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,1) AS harvest_day_mean -- 31
              ,MEDIAN(CASE    WHEN harvest_day >= 0 THEN harvest_day END) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS harvest_day_median -- 32
              ,MIN(day_before_expire) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS beforeexpired_days_min -- 33
              ,MAX(day_before_expire) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS beforeexpired_days_max -- 34
              ,ROUND(
                    AVG(CASE    WHEN day_before_expire >= 0 THEN day_before_expire END) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,1) AS beforeexpired_days_mean -- 35
              ,MEDIAN(CASE    WHEN day_before_expire >= 0 THEN day_before_expire END) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS beforeexpired_days_median -- 36
              
              -- number of distinct product related to the showroom
              ,COUNT(DISTINCT product) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS product_nunique
              ,COUNT(DISTINCT mailing_kecamatan) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS mailing_kecamatan_nunique
              ,COUNT(DISTINCT mailing_kota) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS mailing_kota_nunique
              ,GREATEST(
                      COUNT(DISTINCT application_id) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
                      ,COUNT(DISTINCT agreement_number) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ) number_of_contract -- 51
              
              ,CASE   WHEN SUM(length_experience_anomaly) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) > 0 THEN 1
                      ELSE 0
              END AS length_experience_anomaly -- 5
              ,CASE   WHEN SUM(length_partnership_anomaly) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) > 0 THEN 1
                      ELSE 0
              END AS length_partnership_anomaly -- 9
              ,CASE   WHEN SUM(showroom_ownerage_anomaly) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) > 0 THEN 1
                      ELSE 0
              END AS showroom_ownerage_anomaly -- 13

              ,MIN(supplierinvoice_days_ago) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) supplierinvoice_days_min
              ,MAX(supplierinvoice_days_ago) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) supplierinvoice_days_max
              ,ROUND(
                    AVG(supplierinvoice_days_ago) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,1) supplierinvoice_days_mean
              ,ROUND(
                    STDDEV(supplierinvoice_days_ago) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) supplierinvoice_days_std
              ,MIN(time_to_mature) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) time_mature_min
              ,MAX(time_to_mature) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) time_mature_max
              ,ROUND(
                    AVG(time_to_mature) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,1) time_mature_mean
              ,ROUND(
                    STDDEV(time_to_mature) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) time_mature_std
              ,MIN(time_to_lcinstallmentcalc) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) time_lcinstallmentcalc_min
              ,MAX(time_to_lcinstallmentcalc) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) time_lcinstallmentcalc_max
              ,ROUND(
                    AVG(time_to_lcinstallmentcalc) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,1) time_lcinstallmentcalc_mean
              ,ROUND(
                    STDDEV(time_to_lcinstallmentcalc) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) time_lcinstallmentcalc_std
              ,MIN(return_days_ago) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) return_days_min
              ,MAX(return_days_ago) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) return_days_max
              ,ROUND(
                    AVG(return_days_ago) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,1) return_days_mean
              ,ROUND(
                    STDDEV(return_days_ago) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) return_days_std
              ,MIN(entrydata_process_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS entrydata_process_time_min
              ,MAX(entrydata_process_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS entrydata_process_time_max
              ,ROUND(
                    AVG(entrydata_process_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) AS entrydata_process_time_mean
              ,ROUND(
                    STDDEV(entrydata_process_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) AS entrydata_process_time_std
              ,MIN(survey_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS survey_waiting_time_min
              ,MAX(survey_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS survey_waiting_time_max
              ,ROUND(
                    AVG(survey_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) AS survey_waiting_time_mean
              ,ROUND(
                    STDDEV(survey_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) AS survey_waiting_time_std
              ,MIN(creditscoring_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS creditscoring_waiting_time_min
              ,MAX(creditscoring_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS creditscoring_waiting_time_max
              ,ROUND(
                    AVG(creditscoring_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) AS creditscoring_waiting_time_mean
              ,ROUND(
                    STDDEV(creditscoring_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) AS creditscoring_waiting_time_std
              ,MIN(creditreview_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS creditreview_waiting_time_min
              ,MAX(creditreview_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS creditreview_waiting_time_max
              ,ROUND(
                    AVG(creditreview_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) AS creditreview_waiting_time_mean
              ,ROUND(
                    STDDEV(creditreview_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) AS creditreview_waiting_time_std
              ,MIN(rca_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS rca_waiting_time_min
              ,MAX(rca_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS rca_waiting_time_max
              ,ROUND(
                    AVG(rca_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) AS rca_waiting_time_mean
              ,ROUND(
                    STDDEV(rca_waiting_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) AS rca_waiting_time_std
              ,MIN(delivery_to_purchase) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS delivery_to_purchase_min
              ,MAX(delivery_to_purchase) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS delivery_to_purchase_max
              ,ROUND(
                    AVG(delivery_to_purchase) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) AS delivery_to_purchase_mean
              ,ROUND(
                    STDDEV(delivery_to_purchase) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW )
              ,2) AS delivery_to_purchase_std
              ,COUNT(contract_release_exist) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) contract_release_count
              ,COUNT(contract_npl_exist) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) contract_npl_count
              ,COUNT(contract_wo_exist) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) contract_wo_count
              ,COUNT(entry_lifeinsurance_exist) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) entry_lifeinsurance_count
              ,COUNT(pdc_promised_exist) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) pdc_promised_count
              ,MAX(event_timestamp) OVER(PARTITION BY supplier_id,tmp_id2) AS event_timestamp -- last updated contract information
              -- ,FIRST_VALUE(event_timestamp) OVER (PARTITION BY supplier_id,tmp_id2 ORDER BY event_timestamp DESC) AS event_timestamp
              ,ROW_NUMBER() OVER(PARTITION BY supplier_id, tmp_id2 ORDER BY event_timestamp DESC) rn
      FROM    final_preparation -- if there's multiple upgrade of contract on the same day (ts_id) then just pick the last one
      WHERE   rn_c2 = 1 -- GROUP BY supplier_id
      AND     tmp_id2 IS NOT NULL
  )
  ,aggregate_view_c AS (
      -- just keep single copy of supplier daily
      -- in order to join with the other views
      SELECT * EXCEPT(rn)
      FROM aggregate_contract_prep1
      WHERE rn = 1
  )
  ,business_data_frequencies AS 
  (
      SELECT  supplier_id
              ,tmp_id1 AS ts_id

              ,supplier_npwp AS business_npwp
              ,kepemilikantempatusaha AS business_ownership
              
              ,COUNT(1) OVER (PARTITION BY supplier_id, supplier_npwp ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS npwp_count
              ,COUNT(1) OVER (PARTITION BY supplier_id, kepemilikantempatusaha ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS ownership_count
              ,MAX(event_timestamp) OVER (PARTITION BY supplier_id, supplier_npwp ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS npwp_latest_ts
              ,MAX(event_timestamp) OVER (PARTITION BY supplier_id, kepemilikantempatusaha ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS ownership_latest_ts
              
              ,event_timestamp
      FROM    final_preparation
      WHERE   rn_s2 = 1
  ) 
  -- 01 A 1 -> A
  -- 05 B 1 -> B
  -- 10 B 2 -> B
  -- 13 C 1 -> B
  -- 16 A 2 -> A
  -- 20 B 3 -> B
  -- 23 C 2 -> B
  -- 26 A 3 -> A  
  -- 27 D 1 -> A
  -- 30 A 4 -> A
  ,ranked_business_data AS 
  (
      SELECT  supplier_id
              ,ts_id

              ,FIRST_VALUE(business_npwp) OVER(PARTITION BY supplier_id ORDER BY npwp_count DESC, npwp_latest_ts DESC ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS business_npwp_most
              ,FIRST_VALUE(business_ownership) OVER(PARTITION BY supplier_id ORDER BY ownership_count DESC, ownership_latest_ts DESC ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS business_ownership_most

              ,event_timestamp
              ,ROW_NUMBER() OVER(PARTITION BY supplier_id, ts_id ORDER BY event_timestamp DESC) AS rn-- just make sure no multiple sk_region and or sk_supplier on same supplier_id
      FROM    business_data_frequencies 
  )
  ,mailing_frequencies AS 
  (
      SELECT  supplier_id
              ,tmp_id2 AS ts_id

              ,mailing_kecamatan
              ,mailing_kota
              
              ,COUNT(1) OVER (PARTITION BY supplier_id, mailing_kecamatan, mailing_kota ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS mailing_count
              ,MAX(event_timestamp) OVER (PARTITION BY supplier_id, mailing_kecamatan, mailing_kota ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS latest_timestamp
              
              ,event_timestamp
      FROM    final_preparation
      WHERE   rn_c2 = 1
  )
  ,ranked_mailing AS 
  (
      SELECT  supplier_id
              ,ts_id

              ,FIRST_VALUE(mailing_kecamatan) OVER(PARTITION BY supplier_id ORDER BY mailing_count DESC, latest_timestamp DESC ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS mailing_kecamatan_most
              ,FIRST_VALUE(mailing_kota) OVER(PARTITION BY supplier_id ORDER BY mailing_count DESC, latest_timestamp DESC ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS mailing_kota_most

              ,event_timestamp
              ,ROW_NUMBER() OVER(PARTITION BY supplier_id, ts_id ORDER BY event_timestamp DESC) AS rn
      FROM    mailing_frequencies
  )
  ,mailing_product AS 
  (
      SELECT  supplier_id
              ,tmp_id2 AS ts_id

              ,product
              ,COUNT(1) OVER (PARTITION BY supplier_id, product ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS product_count
              ,MAX(event_timestamp) OVER (PARTITION BY supplier_id, product ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS latest_timestamp
              
              ,event_timestamp
      FROM    final_preparation
      WHERE   rn_c2 = 1
  )
  ,ranked_product AS 
  (
      SELECT  supplier_id
              ,ts_id

              ,FIRST_VALUE(product) OVER (PARTITION BY supplier_id ORDER BY product_count DESC, latest_timestamp DESC ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW ) AS product_most

              ,event_timestamp
              ,ROW_NUMBER() OVER(PARTITION BY supplier_id, ts_id ORDER BY event_timestamp DESC) AS rn
      FROM    mailing_product
  )
  ,feature_view_tab0 AS (
        SELECT  COALESCE(tab_s.supplier_id, tab_c.supplier_id) AS supplier_id
                ,COALESCE(tab_s.ts_id, tab_c.ts_id) AS ts_id
                ,tab_s.* EXCEPT(supplier_id, ts_id, event_timestamp)
                ,tab_c.* EXCEPT(supplier_id, ts_id, event_timestamp)
                ,GREATEST(tab_s.event_timestamp, tab_c.event_timestamp) event_timestamp
        FROM        aggregate_view_s tab_s
        FULL JOIN   aggregate_view_c tab_c
        ON      tab_s.supplier_id = tab_c.supplier_id
        AND     tab_s.ts_id = tab_c.ts_id
    )
  ,feature_view AS (
        SELECT  t1.* EXCEPT(event_timestamp)
                ,t2.* EXCEPT (supplier_id,ts_id,rn,event_timestamp)
                ,t3.* EXCEPT (supplier_id,ts_id,rn,event_timestamp)
                -- ,t3.mailing_kecamatan_most
                -- ,t3.mailing_kota_most
                ,t4.product_most
                ,GREATEST(t1.event_timestamp, t2.event_timestamp, t3.event_timestamp, t4.event_timestamp) AS event_timestamp
                ,ROW_NUMBER() OVER(PARTITION BY t1.supplier_id ORDER BY t1.event_timestamp DESC) AS rn
        FROM    feature_view_tab0 t1
        LEFT JOIN ranked_business_data t2
        ON      t1.supplier_id = t2.supplier_id
        AND     t1.ts_id = t2.ts_id
        AND     t2.rn = 1
        LEFT JOIN ranked_mailing t3
        ON      t1.supplier_id = t3.supplier_id
        AND     t1.ts_id = t3.ts_id
        AND     t3.rn = 1
        LEFT JOIN ranked_product t4
        ON      t1.supplier_id = t4.supplier_id
        AND     t1.ts_id = t4.ts_id
        AND     t4.rn = 1
    )
  ,feature_view_tab2 AS (
      SELECT  supplier_id
              ,ts_id
              ,* EXCEPT(supplier_id, ts_id, event_timestamp, rn) 
              ,event_timestamp
      FROM feature_view
      UNION ALL -- bring the latest calculation onto current partition (bizdate)
      SELECT  supplier_id
              ,'{bizdate}' AS ts_id
              ,* EXCEPT(supplier_id, ts_id, event_timestamp, rn) -- ordering columns
              ,CAST(TO_DATE('{bizdate}', 'yyyymmdd') AS TIMESTAMP) AS event_timestamp 
      FROM feature_view t2
      WHERE t2.rn = 1
      AND   DATEDIFF(TO_DATE('{bizdate}', 'yyyymmdd'), CAST(event_timestamp AS DATETIME), 'dd') < 0-- only refresh the old one  
  )
