    description: Standard deviation of delivery to purchase timeline metrics.
    business_logic: STDDEV(delivery_to_purchase) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: earliest_checkin_time
    type: TIMESTAMP
    description: Initial creation timestamp captured for the earliest operational entry of the supplier profile.
    business_logic: MIN(created_timestamp)
  - name: entry_lifeinsurance_count
    type: INTEGER
    description: Cumulative total counts for life insurance submission checkins.
    business_logic: SUM(entry_lifeinsurance_exist) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: entrydata_process_time_max
    type: DOUBLE
    description: Maximum pipeline time taken to fully input data profiles.
    business_logic: MAX(entrydata_process_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: entrydata_process_time_mean
    type: DOUBLE
    description: Average pipeline time taken to fully input data profiles.
    business_logic: AVG(entrydata_process_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: entrydata_process_time_min
    type: DOUBLE
    description: Minimum pipeline time taken to fully input data profiles.
    business_logic: MIN(entrydata_process_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: entrydata_process_time_std
    type: DOUBLE
    description: Standard deviation of entry data process time logs.
    business_logic: STDDEV(entrydata_process_time) OVER (PARTITION BY supplier_id ORDER BY event_timestamp ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  - name: flat_rate_max
    type: DOUBLE
    description: Absolute peak structural markup contract rate percentage mapped to tracking interactions.
    business_logic: MAX(supplierflatrate)
  - name: flat_rate_mean
    type: DOUBLE
    description: Arithmetic global evaluation average pricing rate computed over application lines.
    business_logic: AVG(supplierflatrate)
  - name: flat_rate_min
    type: DOUBLE
    description: Bottom ceiling pricing baseline processing percentage value applied over historical client books.
    business_logic: MIN(supplierflatrate)
  - name: harvest_day_max
    type: INTEGER
    description: Longest observed turnaround tracking length from baseline master profile generation to deal execution events.
    business_logic: MAX(harvest_day)
  - name: harvest_day_min
    type: INTEGER
    description: Lowest duration metric counting day intervals separating account entry initialization checks from actual transaction bookings.
    business_logic: MIN(harvest_day)
  - name: harvest_day_mean
    type: DOUBLE
    description: Arithmetic mean pipeline conversion timing velocity filtering active entries.
    business_logic: AVG(CASE WHEN harvest_day >= 0 THEN harvest_day END)
  - name: harvest_day_median
    type: INTEGER
    description: Median lifespan baseline measure calculating pipeline delivery operational speed profiles.
    business_logic: MEDIAN(CASE WHEN harvest_day >= 0 THEN harvest_day END)
  - name: isautomotive_first
    type: STRING
    description: First operational business flag recording if the primary product focus belongs to automotive vertical lines.
    business_logic: MIN_BY(isautomotive,contract_timestamp)
  - name: isautomotive_last
    type: STRING
    description: Latest operational automotive vertical enterprise indicator.
    business_logic: MAX_BY(isautomotive,contract_timestamp)
  - name: isautomotive_modified
    type: BOOLEAN
    description: Tracking boolean indicating if enterprise industry specialization shifted focus across history records.
    business_logic: CASE WHEN COUNT(DISTINCT isautomotive) > 1 THEN TRUE ELSE FALSE END
  - name: kecamatan_match_count
    type: INTEGER
    description: Aggregated transaction count monitoring mismatch behavior occurrences between workspace registration records and shipping/billing coordinates.
    business_logic: SUM(kecamatan_match)
  - name: kelurahan_match_count
    type: INTEGER
    description: Total flags checking neighborhood locality differences separating official registry entries from mailing lists.
    business_logic: SUM(kelurahan_match)
  - name: kota_match_count
    type: INTEGER
    description: Volume metric confirming how frequently structural municipal boundaries changed or deviated across documents.
    business_logic: SUM(kota_match)
  # - name: latest_expired_date
  #   type: DATE
  #   description: Maximum historical or terminal active bounds operational profile validity expiration point.
  #   business_logic: MAX(expiration_date)
  - name: length_experience_anomaly
    type: BOOLEAN
    description: Binary indicator identifying if historical experience chronologically decreased backwards over transaction records.
    business_logic: CASE WHEN SUM(length_experience_anomaly) > 0 THEN TRUE ELSE FALSE END
  - name: length_experience_max
    type: INTEGER
    description: Maximum operational experience year tenure captured during contracts.
    business_logic: MAX(YEAR(contract_timestamp) - CAST(pengalamansejaktahun AS INT))
  - name: length_experience_mean
    type: DOUBLE
    description: Average calculated length of experience across historical milestone points.
    business_logic: ROUND(AVG(length_experience),1)
  - name: length_experience_min
    type: INTEGER
    description: Minimum calculated tenure of professional operation experience at the time of contract execution.
    business_logic: MIN(YEAR(contract_timestamp) - CAST(pengalamansejaktahun AS INT))
  - name: length_partnership_anomaly
    type: BOOLEAN
    description: Flag tracking if operational partnership timelines calculated chronologically regress over sequential records.
    business_logic: CASE WHEN SUM(length_partnership_anomaly) > 0 THEN TRUE ELSE FALSE END
  - name: length_partnership_max
    type: INTEGER
    description: Maximum milestone duration of operational corporate partnership.
    business_logic: MAX(YEAR(contract_timestamp) - CAST(pkddenganbfitahun AS INT))
  - name: length_partnership_mean
