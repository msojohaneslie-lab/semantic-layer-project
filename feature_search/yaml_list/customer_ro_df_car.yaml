tags:
  domain: customer
  confidentiality: public
sql: |-
        WITH lookup_window_init AS 
        (
        SELECT  NULLIF(TRIM(confins_application_id),'') applicationid
                ,NULLIF(TRIM(lon.agreement_number),'') agreementno
                ,NULLIF(TRIM(confins_customer_id),'') customerid
                ,lon.dt
                ,TOUPPER(TRIM(product)) AS productname
                ,TOUPPER(TRIM(asset_type_id)) AS productgroup
                ,GREATEST(golive_at,CAST(lon.application_date AS DATETIME)) AS event_timestamp
                ,ROW_NUMBER() OVER (PARTITION BY COALESCE(application_id,lon.agreement_number),confins_customer_id,product,asset_type_id ORDER BY lon.application_date DESC ) rn
        FROM    wsDataInnovation.cdp_loan lon
        LEFT JOIN wsDataInnovation.cdp_asset ast
        ON      lon.agreement_number = ast.agreement_number
        AND     lon.dt = ast.dt
        WHERE   lon.dt = '{bizdate}'
        AND     lon.contract_status NOT IN ('CAN','PRP','RJC')
        )
        ,RO_DF_prep1 AS 
        (
        -- ro df car within 2021 - 2026
        -- negative sampling: df car first time (rn=1) within 2021 - 2026
        SELECT  * EXCEPT (rn)
                ,ROW_NUMBER() OVER (PARTITION BY customerid ORDER BY event_timestamp ) rn -- re-occurence index
        FROM    lookup_window_init
        WHERE   customerid IN (
                        -- only focus on df car during 2021 - 2026 whether it's new or ro
                        SELECT  customerid
                        FROM    lookup_window_init
                        WHERE   productname = 'DF'
                        AND     productgroup = 'MOBIL'
                        AND     (
                                CAST(event_timestamp AS DATETIME) BETWEEN TO_DATE('20210101','yyyymmdd') AND TO_DATE('{bizdate}','yyyymmdd')
                        )
                ) 
        AND     rn = 1
        )
        ,RO_DF_prep2 AS 
        (
        SELECT  *
                ,LAG(COALESCE(applicationid,agreementno),1) OVER (PARTITION BY customerid ORDER BY event_timestamp ) prev_contract
                ,LEAD(COALESCE(applicationid,agreementno),1) OVER (PARTITION BY customerid ORDER BY event_timestamp ) next_contract
                ,COALESCE(
                        DATEADD(LEAD(event_timestamp,1) OVER (PARTITION BY customerid ORDER BY event_timestamp ),-1,'dd')
                ,TO_DATE('{bizdate}','yyyymmdd')) AS upper_time_limit
        FROM    RO_DF_prep1
        )
        ,RO_DF_feat3 AS 
        (
        SELECT  rdp.*
                ,idr.cdp_uid
                ,main_branch
                ,branch
                ,sub_branch
                ,TOUPPER(TRIM(csa.mailingkelurahan)) AS mailingkelurahan
                ,TOUPPER(TRIM(csa.mailingkecamatan)) AS mailingkecamatan
                ,TOUPPER(TRIM(csa.mailingcity)) AS mailingcity
                ,TOUPPER(TRIM(csa.mailingzipcode)) AS mailingzipcode
                ,TOUPPER(TRIM(csa.referencekelurahan)) AS referencekelurahan
                ,TOUPPER(TRIM(csa.referencekecamatan)) AS referencekecamatan
                ,TOUPPER(TRIM(csa.referencecity)) AS referencecity
                ,TOUPPER(TRIM(csa.referencezipcode)) AS referencezipcode
                ,TOUPPER(COALESCE(NULLIF(TRIM(sup.supplier_kelurahan),'-'),TRIM(sup.supplier_kelurahan_header))) AS supplierkelurahan
                ,TOUPPER(COALESCE(NULLIF(TRIM(sup.supplier_kecamatan),'-'),TRIM(sup.supplier_kecamatan_header))) AS supplierkecamatan
                ,TOUPPER(COALESCE(NULLIF(TRIM(sup.supplier_kota),'-'),TRIM(sup.supplier_kota_header))) AS suppliercity
                ,TOUPPER(COALESCE(NULLIF(TRIM(vdr.branch_city),"N/A"),NULLIF(TRIM(cg_city),"N/A"))) AS branchcity
                ,NULLIF(TOUPPER(TRIM(led.kelurahan_name)), "-") AS customerlead_kelurahan
                ,NULLIF(TOUPPER(TRIM(led.kecamatan_name)), "-") AS customerlead_kecamatan
                ,NULLIF(TOUPPER(TRIM(led.city_name)),"N/A") AS customerlead_city
                ,NULLIF(TOUPPER(TRIM(led.zip_code)), "") AS customerlead_zipcode
                ,TOUPPER(COALESCE(NULLIF(TRIM(branch_zipcode),"N/A"),NULLIF(TRIM(cg_zipcode),"N/A"))) AS branchzipcode -- collection record
                ,col.collection_effectiveness
                ,col.collection_expenses
                ,lon.ever_30
                ,lon.ever_60
                ,lon.ever_90
                ,col.prev_bucket
                ,col.latest_bucket
                ,col.dpd
                ,col.max_dpd_last_1_month
                ,col.max_dpd_last_3_month
                ,col.fid
                ,col.repossess_date
                ,col.inventory_date
                ,col.settlement_date
                ,col.amount_due
                ,col.created_timestamp AS collection_created
                ,col.updated_timestamp AS collection_updated -- customer demography
                ,ROUND(DATEDIFF(CAST(event_timestamp AS DATETIME),CAST(led.date_of_birth AS DATETIME),'dd') / 365.24,1) customer_age
                ,led.age AS age_precomputed
                ,led.monthly_income
                ,led.home_status
                ,led.home_location
                ,led.stay_since_year
                ,led.length_of_stay_year
                ,led.occupation_type
                ,led.education
                ,led.marital_status
                ,led.dependent_number
                ,led.customer_profession
                ,led.customer_economy_sector
                ,led.customer_industry_type_group
                ,led.customer_purpose
                ,led.customer_status
                ,led.duration_of_work
                ,led.customer_rating
                ,LEAST(led.lead_created_at,led.created_timestamp) AS lead_created
                ,led.updated_timestamp AS lead_updated -- fee
                ,lon.admin_fee
                ,lon.fiducia_fee
                ,lon.provision_fee
                ,lon.survey_fee
                ,lon.other_fee -- insurance
                ,lon.life_insurance_coverage
                ,lon.life_insurance_premium
                ,lon.asset_insurance_premium -- loan onboarding
                ,lon.way_of_financing
                ,lon.marketing1_id
                ,lon.marketing_name
                ,lon.soa
                ,lon.tenor
                ,lon.otr_price
                ,lon.funding_amount
                ,lon.ntf_amount
                ,lon.interest_rate
                ,lon.ltv
                ,lon.mature_at
                ,lon.rrd_date
                ,lon.ba_commision
                ,lon.remaining_installment_number
                ,CAST(lon.created_timestamp AS DATETIME) AS loan_inserted -- loan outstanding
                ,col.outstanding_principal
                ,lon.outstanding_interest_due -- status
                ,lon.contract_status
                ,lon.default_status
                ,lon.active_status
                ,lon.fiducia_validation_status -- payment summary
                ,pay.late_payment_count
                ,pay.late_payment_ratio
                ,pay.consecutive_late_count
                ,pay.consecutive_late_ratio
                ,pay.prepayment_count
                ,pay.prepayment_amount
                ,pay.created_timestamp AS payment_created
                ,pay.updated_timestamp AS payment_updated -- asset
                ,ast.created_timestamp AS asset_registered
                ,ast.asset_seq_no
                ,ast.asset_category
                ,ast.asset_condition
                ,ast.asset_usage
                ,ast.brand
                ,ast.manufacturing_year
                ,ast.sub_category
                ,ast.product_type
                ,ast.tax_status
                ,ast.stnk_status
                ,ast.document_track AS bpkb_status
                ,ast.num_of_asset_owned
                ,ast.owner_relationship
                ,ast.bpkb_ownership -- pefindo
                ,pef.pefindo_profile_total_installment
                ,pef.pefindo_profile_max_collection_last_12_month
                ,pef.pefindo_profile_pefindo_detail_scoring_type
                ,pef.pefindo_profile_pefindo_detail_customer_grade
                ,pef.created_timestamp AS pefindo_created
                ,pef.updated_timestamp AS pefindo_updated
                ,TOUPPER(TRIM(csa.supplierid)) AS supplierid
                ,csa.insrefundtosupplier
                ,csa.insrefundtosupplierpaid
                ,csa.insrefundtosupplierinprocess
                ,csa.supplierrate
                ,csa.supplierinvoicedate
                ,csa.isincentivesupplier
                ,csa.supplierflatrate
                ,TOUPPER(TRIM(sup.supplier)) AS suppliername
        FROM    RO_DF_prep2 rdp
        LEFT JOIN wsdatainnovation.cdp_loan lon
        ON      lon.agreement_number = rdp.agreementno
        AND     lon.dt = rdp.dt
        AND     CAST(lon.created_timestamp AS DATETIME) < rdp.upper_time_limit
        LEFT JOIN wsbfi_2.dwh_vw_dim_region_odps vdr
        ON      TRIM(lon.branch_id) = TRIM(vdr.id_branch)
        AND     CAST(rdp.event_timestamp AS DATETIME) BETWEEN vdr.effective_date AND COALESCE(vdr.expiration_date,TO_DATE('{bizdate}','yyyymmdd'))
        LEFT JOIN wsDataInnovation.cdp_asset ast
        ON      ast.agreement_number = rdp.agreementno
        AND     ast.dt = rdp.dt
        AND     CAST(ast.created_timestamp AS DATETIME) < rdp.upper_time_limit
        LEFT JOIN wsDataInnovation.cdp_lead led
        ON      led.confins_customer_id = rdp.customerid
        AND     led.dt = rdp.dt
        AND     GREATEST(led.updated_timestamp,led.created_timestamp) < CAST(rdp.upper_time_limit AS TIMESTAMP)
        LEFT JOIN wsDataInnovation.cdp_collection col
        ON      col.agreement_number = rdp.agreementno
        AND     col.dt = rdp.dt
        AND     GREATEST(col.updated_timestamp,col.created_timestamp) < CAST(rdp.upper_time_limit AS TIMESTAMP)
        LEFT JOIN wsDataInnovation.cdp_score pef
        ON      pef.application_id = rdp.applicationid
        AND     pef.dt = rdp.dt
        AND     GREATEST(pef.updated_timestamp,pef.created_timestamp) < CAST(rdp.upper_time_limit AS TIMESTAMP)
        LEFT JOIN wsDataInnovation.cdp_payment_summary pay
        ON      pay.confins_customer_id = rdp.customerid
        AND     pay.dt = rdp.dt
        AND     GREATEST(pay.updated_timestamp,pay.created_timestamp) < CAST(rdp.upper_time_limit AS TIMESTAMP)
        LEFT JOIN wsbfi_2.confins_stg_agreement_odps csa
        ON      TRIM(csa.applicationid) = rdp.applicationid
        LEFT JOIN wsDataInnovation.cdp_identity_resolution idr
        ON      TRIM(idr.agreement_number) = rdp.agreementno
        AND     idr.dt = rdp.dt
        LEFT JOIN wsbfi_2.dwh_dim_supplier_odps sup
        ON      TRIM(csa.supplierid) = TRIM(sup.id_supplier)
        AND     CAST(rdp.event_timestamp AS DATETIME) BETWEEN sup.effective_date AND COALESCE(sup.expiration_date,TO_DATE('{bizdate}','yyyymmdd'))
        )
        ,RO_DF_final AS 
        (
        SELECT  * EXCEPT (rn)
                ,CASE   WHEN (mailingkelurahan = referencekelurahan) AND mailingkelurahan NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_kelurahan_mailing_reference
                ,CASE   WHEN (mailingkecamatan = referencekecamatan) AND mailingkecamatan NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_kecamatan_mailing_reference
                ,CASE   WHEN (mailingcity = referencecity) AND mailingcity NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_city_mailing_reference
                ,CASE   WHEN (mailingzipcode = referencezipcode) AND mailingzipcode NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_zipcode_mailing_reference
                ,CASE   WHEN (mailingkelurahan = supplierkelurahan) AND supplierkelurahan NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_kelurahan_mailing_supplier
                ,CASE   WHEN (mailingkecamatan = supplierkecamatan) AND supplierkecamatan NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_kecamatan_mailing_supplier
                ,CASE   WHEN (mailingcity = suppliercity) AND suppliercity NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_city_mailing_supplier
                ,CASE   WHEN (referencekelurahan = supplierkelurahan) AND supplierkelurahan NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_kelurahan_reference_supplier
                ,CASE   WHEN (referencekecamatan = supplierkecamatan) AND supplierkecamatan NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_kecamatan_reference_supplier
                ,CASE   WHEN (referencecity = suppliercity) AND suppliercity NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_city_reference_supplier
                ,CASE   WHEN (mailingcity = branchcity) AND branchcity NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_city_mailing_branch
                ,CASE   WHEN (mailingzipcode = branchzipcode) AND branchzipcode NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_zipcode_mailing_branch
                ,CASE   WHEN (referencecity = branchcity) AND branchcity NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_city_reference_branch
                ,CASE   WHEN (referencezipcode = branchzipcode) AND branchzipcode NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_zipcode_reference_branch

                ,CASE   WHEN (customerlead_kelurahan = supplierkelurahan) AND customerlead_kelurahan NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_kelurahan_customerlead_supplier
                ,CASE   WHEN (customerlead_kecamatan = supplierkecamatan) AND customerlead_kecamatan NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_kecamatan_customerlead_supplier
                ,CASE   WHEN (customerlead_city = branchcity) AND customerlead_city NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_city_customerlead_branch
                ,CASE   WHEN (customerlead_zipcode = branchzipcode) AND customerlead_zipcode NOT IN ('-','x','0') THEN 1
                        ELSE 0
                END AS is_same_zipcode_customerlead_branch
                ,rn AS idx
                ,ROW_NUMBER() OVER (PARTITION BY customerid,COALESCE(applicationid,agreementno),productname,productgroup,rn,prev_contract,next_contract ORDER BY GREATEST(CAST(loan_inserted AS TIMESTAMP),asset_registered,COALESCE(lead_updated,lead_created),COALESCE(payment_updated,payment_created),COALESCE(pefindo_updated,pefindo_created),COALESCE(collection_updated,collection_created)) ) rn
        FROM    RO_DF_feat3
        )
