        , test_case AS (
        SELECT  * EXCEPT(idx, event_timestamp) -- reorder field
                ,COALESCE(admin_fee, 0) + COALESCE(fiducia_fee, 0) + COALESCE(provision_fee, 0) + COALESCE(survey_fee, 0) + COALESCE(other_fee, 0) AS total_fee
                ,(DATEPART(event_timestamp, 'yyyy') - CAST(manufacturing_year AS INT)) AS asset_age
                ,idx -- contract index
                ,event_timestamp
        FROM feature_set
        )
