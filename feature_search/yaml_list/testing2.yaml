tags:
- domain: testing
  confidentiality: public
sql: |-
  WITH p AS (
    SELECT
      SUM(a.lol - b.XD) AS ni_jiao2
    FROM LEFT
    JOIN testTb AS b
      ON a.id = b.id AND flag = (
        SELECT
          MAX(id)
        FROM testTc
      )
    WHERE
      a.lol < 5
  ), p AS (
    SELECT
      SUM(a.67attr) - MIN(b.76attr) AS boom123
    FROM 
    JOIN testTb AS b
      ON a.id = b.id AND flag = (
        SELECT
          MAX(id)
        FROM testTc
      )
    WHERE
      a.lol < 5
  )
  SELECT
    SUM(A) + b AS abc5dasar,
    ni_jiao2,
    boom123
  FROM p
